# Reaper config for one repo. Copy to <context>/reaper/<owner>-<repo>.yaml,
# where <context> is $SKILLZ_CONTEXT or ~/.config/skillz.

identity:
  assignee: your-github-login # in-flight issues are assigned here

implementer:
  handle: "@your-bot" # the bot Reaper tags to triage and fix issues

labels:
  pick: reaper # a human adds this to hand an issue to Reaper
  rejected: reaper-rejected # added when a task turns out too deep
  pr: reaper # added to every PR that comes out of Reaper

pick:
  types: [bug, tech-debt] # the issue must also carry one of these
  exclude_labels: []

ai_generated: # how to tell an AI-filed issue (only those may be closed)
  authors: []
  labels: []
  body_markers: []

limits:
  max_diff_lines: 150
  excluded_paths: [] # globs the fix must not touch

caps:
  max_in_flight: 3 # issues being triaged, fixed or reviewed at once
  daily_max: 2 # new issues started per local day
  stuck_hours: 24 # no bot activity this long counts as stuck

project: # optional: set the issue's board status on claim
  # owner: your-org
  # number: 1
  # status_field: Status
  # in_progress: In Progress

pr:
  extra_labels: []

announce:
  mode: draft # draft | post | off
  channel: # where approval requests go
